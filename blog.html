    /* ===== Light Theme Variables (same as index.html) ===== */
    :root {
      --bg: #f7f8fc;
      --bg-white: #ffffff;
      --bg-card: #ffffff;
      --line: rgba(0, 0, 0, 0.07);
      --text: #1e293b;
      --text-s: #475569;
      --muted: #94a3b8;
      --cyan: #0ea5e9;
      --blue: #3b82f6;
      --green: #10b981;
      --purple: #8b5cf6;
      --yellow: #eab308;
      --orange: #f97316;
      --sh-sm: 0 1px 3px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.04);
      --sh-md: 0 4px 16px rgba(0,0,0,.06), 0 12px 40px rgba(0,0,0,.06);
      --sh-lg: 0 8px 30px rgba(0,0,0,.08), 0 24px 60px rgba(0,0,0,.10);
      --r-sm: 16px;
      --bg-code: #f1f5f9;
      font-family: "Pretendard", system-ui, sans-serif;
    }

    /* ===== Dark Theme ===== */
    [data-theme="dark"] {
      --bg: #0f172a;
      --bg-white: #1e293b;
      --bg-card: #1e293b;
      --line: rgba(255,255,255,.08);
      --text: #e2e8f0;
      --text-s: #94a3b8;
      --muted: #64748b;
      --bg-code: #0f172a;
      --sh-sm: 0 1px 3px rgba(0,0,0,.2), 0 4px 12px rgba(0,0,0,.15);
      --sh-md: 0 4px 16px rgba(0,0,0,.25), 0 12px 40px rgba(0,0,0,.2);
      --sh-lg: 0 8px 30px rgba(0,0,0,.35), 0 24px 60px rgba(0,0,0,.3);
    }
    [data-theme="dark"] .navbar { background: rgba(15,23,42,.85) }
    [data-theme="dark"] .hero { background: radial-gradient(ellipse at 20% 30%, rgba(14,165,233,.12), transparent 50%), radial-gradient(ellipse at 75% 20%, rgba(16,185,129,.10), transparent 45%) }
    [data-theme="dark"] .modal-body pre { background: var(--bg-code) }
    [data-theme="dark"] .snippet-code { background: var(--bg-code) }
    *, *::before, *::after { box-sizing: border-box; margin: 0 }
    html { scroll-behavior: smooth }
    body { background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased }
    a { color: inherit; text-decoration: none }
    button { font: inherit; color: inherit; border: none; outline: none; cursor: pointer; background: none }

    /* ===== Navbar ===== */
    .navbar { position: sticky; top: 0; z-index: 50; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.82); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%) }
    .navbar-inner { max-width: 1200px; margin: 0 auto; padding: 0 24px; height: 64px; display: flex; align-items: center; justify-content: space-between }
    .navbar-brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 17px; color: var(--text) }
    .navbar-brand .icon { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, var(--cyan), var(--green)); color: #fff; font-size: 12px; font-weight: 800 }
    .navbar-brand .accent { color: var(--cyan) }
    .navbar-links { display: flex; gap: 24px; font-size: 14px; font-weight: 500; align-items: center }
    .navbar-links a { color: var(--text-s); transition: color .2s; line-height: 1 }
    .navbar-links a:hover { color: var(--cyan) }
    .navbar-links a.active { color: var(--cyan); font-weight: 700 }

    /* ===== Hero ===== */
    .hero { max-width: 1200px; margin: 0 auto; padding: 56px 24px 40px; background: radial-gradient(ellipse at 20% 30%, rgba(14,165,233,.06), transparent 50%), radial-gradient(ellipse at 75% 20%, rgba(16,185,129,.05), transparent 45%) }
    .hero h1 { font-size: clamp(30px, 4.5vw, 44px); font-weight: 800; color: var(--text); line-height: 1.25; margin-bottom: 14px; letter-spacing: -.03em }
    .hero h1 .gradient { background: linear-gradient(135deg, var(--cyan), var(--green)); -webkit-background-clip: text; color: transparent }
    .hero p { color: var(--muted); font-size: 15px; line-height: 1.7; max-width: 640px; margin-bottom: 28px }
    .search-wrap { position: relative; max-width: 500px }
    .search-wrap input { width: 100%; background: var(--bg-white); border: 1px solid var(--line); border-radius: 14px; padding: 13px 18px 13px 44px; font-size: 14px; color: var(--text); transition: all .2s; box-shadow: var(--sh-sm) }

    .search-wrap .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 16px }

    /* ===== Layout ===== */
    .main { max-width: 1200px; margin: 0 auto; padding: 0 24px 80px; display: grid; grid-template-columns: 200px 1fr; gap: 40px }

    /* ===== Sidebar ===== */
    .sidebar { position: sticky; top: 88px; align-self: start }
    .sidebar h3 { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .12em; margin-bottom: 10px; padding: 0 8px }
    .sidebar ul { list-style: none; padding: 0 }
    .cat-btn { display: flex; align-items: center; gap: 6px; width: 100%; padding: 9px 12px; border-radius: 10px; font-size: 13px; font-weight: 500; color: var(--text-s); transition: all .2s; text-align: left }

    .cat-btn.active { background: rgba(14,165,233,.08); color: var(--cyan); font-weight: 700 }

    /* ===== Tab Nav ===== */
    .tab-nav { display: flex; gap: 4px; margin-bottom: 20px; background: var(--bg-white); border-radius: 14px; padding: 4px; border: 1px solid var(--line); box-shadow: var(--sh-sm) }
    .tab-btn { padding: 10px 20px; border-radius: 11px; font-size: 13px; font-weight: 600; color: var(--text-s); transition: all .2s }
    .tab-btn:hover { color: var(--cyan) }
    .tab-btn.active { background: linear-gradient(135deg, var(--cyan), var(--green)); color: #fff; box-shadow: 0 2px 8px rgba(14,165,233,.2) }

    /* ===== Feed ===== */
    .feed-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px }
    .feed-header h2 { font-size: 18px; font-weight: 800; color: var(--text) }
    .feed-header span { font-size: 13px; color: var(--muted) }

    /* ===== Post Card ===== */
    .post-card { background: var(--bg-card); border: 1px solid var(--line); border-radius: 18px; padding: 24px 28px; margin-bottom: 14px; cursor: pointer; transition: all .25s; box-shadow: var(--sh-sm) }
    .post-card:hover { transform: translateY(-3px); box-shadow: var(--sh-md); border-color: rgba(14,165,233,.2) }
    .post-meta { display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 600; margin-bottom: 12px; flex-wrap: wrap }
    .level-badge { padding: 3px 9px; border-radius: 6px; font-size: 11px; font-weight: 700 }
    .level-expert { background: rgba(139,92,246,.1); color: var(--purple); border: 1px solid rgba(139,92,246,.18) }
    .level-advanced { background: rgba(14,165,233,.08); color: var(--cyan); border: 1px solid rgba(14,165,233,.15) }
    .level-intermediate { background: rgba(16,185,129,.08); color: var(--green); border: 1px solid rgba(16,185,129,.15) }
    .level-beginner { background: rgba(234,179,8,.08); color: var(--yellow); border: 1px solid rgba(234,179,8,.15) }
    .meta-text { color: var(--muted); display: flex; align-items: center; gap: 3px }
    .post-title { font-size: 20px; font-weight: 800; color: var(--text); margin-bottom: 8px; line-height: 1.35; transition: color .2s }

    .post-excerpt { color: var(--text-s); font-size: 14px; line-height: 1.7; margin-bottom: 16px }
    .post-footer { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px }
    .post-tags { display: flex; flex-wrap: wrap; gap: 5px }
    .post-tag { font-size: 11px; font-weight: 600; color: var(--cyan); background: rgba(14,165,233,.06); padding: 3px 8px; border-radius: 6px; border: 1px solid rgba(14,165,233,.12) }
    .read-more { font-size: 13px; font-weight: 700; color: var(--cyan); display: flex; align-items: center; gap: 4px; transition: gap .2s }
    .post-card:hover .read-more { gap: 8px }

    /* ===== Snippet Card ===== */
    .snippet-card { background: var(--bg-card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; margin-bottom: 14px; box-shadow: var(--sh-sm); transition: all .25s }
    .snippet-card:hover { box-shadow: var(--sh-md) }
    .snippet-header { padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); background: rgba(14,165,233,.02) }
    .snippet-header h4 { font-size: 14px; font-weight: 700; color: var(--text) }
    .snippet-lang { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: rgba(14,165,233,.08); color: var(--cyan) }
    .snippet-code { padding: 18px 20px; font-family: "JetBrains Mono", monospace; font-size: 13px; line-height: 1.7; color: var(--text); overflow-x: auto; white-space: pre; background: #f1f5f9; border-bottom: 1px solid var(--line) }
    .snippet-desc { padding: 12px 20px; font-size: 13px; color: var(--text-s); line-height: 1.6 }
    .snippet-card .post-tags { padding: 0 20px 14px }

    /* ===== Series Card ===== */
    .series-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px }
    .series-card { background: var(--bg-card); border: 1px solid var(--line); border-radius: 18px; padding: 22px; box-shadow: var(--sh-sm); transition: all .25s; cursor: pointer }
    .series-card:hover { transform: translateY(-3px); border-color: rgba(14,165,233,.2); box-shadow: var(--sh-md) }
    .series-card h4 { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 6px }
    .series-card p { font-size: 13px; color: var(--text-s); line-height: 1.6; margin-bottom: 10px }
    .series-meta { display: flex; gap: 12px; font-size: 12px; color: var(--muted) }
    .series-progress { height: 4px; border-radius: 2px; background: var(--line); margin-top: 10px; overflow: hidden }
    .series-progress-bar { height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--cyan), var(--green)) }

    /* ===== Modal (same style as index.html) ===== */
    .modal-overlay { position: fixed; inset: 0; z-index: 200; background: rgba(15,23,42,.3); backdrop-filter: blur(6px); display: flex; align-items: flex-end; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .35s }
    .modal-overlay.active { opacity: 1; pointer-events: all }
    .modal-content { width: min(880px, 96vw); max-height: 90vh; background: var(--bg-white); border-radius: 28px 28px 0 0; box-shadow: var(--sh-lg); overflow: hidden; display: flex; flex-direction: column; transform: translateY(100%); transition: transform .45s cubic-bezier(.4,0,.2,1) }
    .modal-overlay.active .modal-content { transform: translateY(0) }
    .modal-handle { width: 40px; height: 5px; border-radius: 3px; background: #d1d5db; position: absolute; top: 8px; left: 50%; transform: translateX(-50%) }
    .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 22px 28px 14px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg-white); z-index: 1 }
    .modal-title { font-weight: 800; font-size: 16px }
    .modal-close { width: 36px; height: 36px; border-radius: 50%; background: rgba(0,0,0,.04); display: grid; place-items: center; font-size: 18px; color: var(--muted); transition: all .2s }
    .modal-close:hover { background: rgba(248,113,113,.12); color: #ef4444 }
    .modal-body { padding: 28px; overflow-y: auto; flex: 1 }
    .modal-body h2 { font-size: clamp(20px, 3vw, 26px); letter-spacing: -.02em; margin-bottom: 6px; color: var(--text) }
    .modal-body h3 { margin-top: 24px; padding-bottom: 6px; border-bottom: 1px solid var(--line); font-size: 15px; color: var(--text) }
    .modal-body p, .modal-body li { color: var(--text-s); line-height: 1.8; font-size: 14px }
    .modal-body ul { padding-left: 20px }
    .modal-body li { margin-bottom: 4px }
    .modal-body .tag-list { display: flex; flex-wrap: wrap; gap: 5px; margin: 10px 0 16px }
    .modal-body .tag { display: inline-flex; padding: 4px 9px; border-radius: 7px; font-size: 12px; font-weight: 600; background: rgba(14,165,233,.07); color: var(--cyan); border: 1px solid rgba(14,165,233,.13) }
    .modal-body pre { background: #f1f5f9; border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px; font-family: "JetBrains Mono", monospace; font-size: 13px; line-height: 1.7; overflow-x: auto; margin: 12px 0 }
    .modal-body .img-wrap { border-radius: 12px; overflow: hidden; border: 1px solid var(--line); margin: 12px 0 }
    .modal-body .img-wrap img { width: 100%; height: auto; display: block }

    /* ===== Empty ===== */
    .empty-state { padding: 64px 0; text-align: center; border: 1px dashed var(--line); border-radius: 16px; color: var(--muted) }

    /* ===== Footer ===== */
    .blog-footer { border-top: 1px solid var(--line); padding: 28px 24px; text-align: center; color: var(--muted); font-size: 13px }
    .blog-footer-inner { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px }
    .blog-footer a { color: var(--text-s); transition: color .2s }
    .blog-footer a:hover { color: var(--cyan) }

    /* ===== Theme Toggle Button ===== */
    .theme-toggle-btn {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: rgba(14, 165, 233, .06);
      border: 1px solid var(--line);
      font-size: 16px;
      cursor: pointer;
      transition: all .2s;
      flex-shrink: 0;
      margin-left: 8px;
    }
    .theme-toggle-btn:hover { background: rgba(14,165,233,.12); border-color: rgba(14,165,233,.25) }
    .lang-btn { padding: 7px 14px; font-size: 12px; font-weight: 700; background: var(--bg-white); color: var(--text-s); transition: all .2s }
    .lang-btn.active { background: var(--cyan); color: #fff }
    .lang-btn:hover:not(.active) { background: rgba(14,165,233,.05) }

    /* ===== Snippet Category Chips ===== */
    .snippet-cats { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 14px }
    .snippet-cat-btn { padding: 5px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; background: var(--bg-white); color: var(--text-s); border: 1px solid var(--line); transition: all .2s }
    .snippet-cat-btn:hover { border-color: var(--cyan); color: var(--cyan) }
    .snippet-cat-btn.active { background: rgba(14,165,233,.08); color: var(--cyan); border-color: rgba(14,165,233,.2) }

    @media(max-width:800px) {
      .main { grid-template-columns: 1fr }
      .sidebar { position: static }
      .sidebar ul { display: flex; flex-wrap: wrap; gap: 4px }
      .sidebar h3 { display: none }
      .cat-btn { padding: 7px 10px; font-size: 12px; white-space: nowrap }
      .navbar-links { display: none }
    }
  </style>
</head>

  // I항 Anti-Windup: ±IMAX 범위 제한

  if (err_sum < -IMAX) err_sum = -IMAX;

               + KD * (err - err_prev);

  // LPF: 고주파 진동 억제

           + LPF_ALPHA * output;

          { type: "h3", text: "🎯 개요: 왜 이 분석이 필요한가?" },
          { type: "p", text: "방산 및 전장 업계의 시니어 엔지니어들은 신입 지원자가 단순히 오픈소스를 복사해 센서 값을 띄웠는지, 아니면 데이터시트의 하드웨어 특성을 완벽히 이해하고 예외 처리(Fail-Safe)를 반영했는지를 송곳 질문을 통해 검증합니다." },

          { type: "h3", text: "⚙️ MPU6050 (1) — PWR_MGMT_1 / SLEEP 함정" },
          { type: "p", text: "레지스터: PWR_MGMT_1 (0x6B) | Bit 7: DEVICE_RESET | Bit 6: SLEEP | 기본값: 0x40 (부팅 즉시 SLEEP 진입)" },
          { type: "p", text: "❓ 면접 질문: \"보드가 켜진 후 MPU6050 초기화 시 데이터가 전혀 읽히지 않는다면 가장 먼저 무엇을 확인하겠는가?\"" },
          { type: "p", text: "✅ 모범 답변: MPU6050은 부팅 시 기본적으로 SLEEP 모드(Bit 6 = 1)로 시작합니다. 가동 직후 PWR_MGMT_1 레지스터의 Bit 6을 0으로 클리어하여 클럭 소스를 설정하고 센서를 깨워야 합니다. 또한 센서 락업을 차단하기 위해 초기화 첫 단계에서 Bit 7(0x80)을 작성하여 하드웨어 소프트 리셋을 선행해야 합니다." },
          { type: "code", lang: "C", title: "MPU6050 초기화 핵심 순서", code: `// 1. 소프트 리셋 (Bit7 = 1)
HAL_I2C_Mem_Write(&hi2c1, MPU6050_ADDR<<1, 0x6B, 1, "\x80", 1, 50);
HAL_Delay(100);  // 리셋 안정화 대기

// 2. SLEEP 해제 + PLL with X Gyro 클럭 소스 설정
uint8_t pwr = 0x01;  // Bit6=0(WAKE), Bit2:0=001(CLKSEL=PLL X)
HAL_I2C_Mem_Write(&hi2c1, MPU6050_ADDR<<1, 0x6B, 1, &pwr, 1, 50);` },

          { type: "h3", text: "⚙️ MPU6050 (2) — SMPLRT_DIV 계산" },
          { type: "p", text: "레지스터: SMPLRT_DIV (0x19) | 공식: Sample Rate = Gyroscope Output Rate / (1 + SMPLRT_DIV)" },
          { type: "p", text: "❓ 면접 질문: \"RTOS 환경에서 MPU6050의 샘플링 주기를 50Hz(20ms)로 제어하고 싶다. 관련 레지스터를 어떻게 계산하여 설정할 것인가?\"" },
          { type: "p", text: "✅ 모범 답변: DLPF가 활성화된 상태에서 자이로 기본 출력 속도는 1kHz입니다. 50Hz = 1000 / (1 + SMPLRT_DIV) → SMPLRT_DIV = 19. 따라서 0x19 레지스터에 10진수 19(0x13)를 기입합니다." },
          { type: "code", lang: "C", title: "SMPLRT_DIV 50Hz 설정", code: `// DLPF 활성화 (0x1A: CONFIG reg, DLPF_CFG=3 → Gyro BW 44Hz)
uint8_t dlpf = 0x03;
HAL_I2C_Mem_Write(&hi2c1, MPU6050_ADDR<<1, 0x1A, 1, &dlpf, 1, 50);

// SMPLRT_DIV = 19 → Sample Rate = 1000/(1+19) = 50Hz
uint8_t smplrt = 19;
HAL_I2C_Mem_Write(&hi2c1, MPU6050_ADDR<<1, 0x19, 1, &smplrt, 1, 50);` },

          { type: "h3", text: "⚙️ MPU6050 (3) — 인터럽트 Event-Driven 설계" },
          { type: "p", text: "레지스터: INT_ENABLE (0x38) | Bit 0: DATA_RDY_EN | INT 핀에 High 펄스 출력" },
          { type: "p", text: "❓ 면접 질문: \"인터럽트 방식(Event-Driven)으로 자이로를 읽을 때, CPU 점유율을 최소화하기 위한 FSM 설계와 핀 설정을 말해보라.\"" },
          { type: "p", text: "✅ 모범 답변: INT_ENABLE의 DATA_RDY_EN을 활성화하여 ADC 연산 완료 시 INT 핀(GPIO EXTI)을 트리거합니다. EXTI ISR 내에서는 Binary Semaphore를 Release하기만 하고 즉시 복귀. 대기 중이던 전용 Task가 Deferred Interrupt Processing 아키텍처로 데이터를 취득합니다." },
          { type: "code", lang: "C", title: "Deferred Interrupt Processing 패턴", code: `// EXTI ISR — 최소한의 작업만
void HAL_GPIO_EXTI_Callback(uint16_t GPIO_Pin) {
    if (GPIO_Pin == MPU_INT_Pin) {
        BaseType_t xHigherPriorityTaskWoken = pdFALSE;
        xSemaphoreGiveFromISR(GyroReadySemHandle, &xHigherPriorityTaskWoken);
        portYIELD_FROM_ISR(xHigherPriorityTaskWoken);  // 즉시 Task 깨우기
    }
}

// gyroSystemTask — 세마포어 대기 후 데이터 취득
void gyroSystemTask(void *arg) {
    for (;;) {
        if (osSemaphoreAcquire(GyroReadySemHandle, osWaitForever) == osOK) {
            const float dt = elapsed_ms / 1000.0f;
            if (!imu_update_math(dt)) {
                set_imu_fault();
                osDelay(100);
            }
        }
    }
}` },

          { type: "h3", text: "🧲 HMC5883L (1) — Single-Measurement 함정" },
          { type: "p", text: "레지스터: Mode Register (0x02) | Bits 1-0: MD | 기본값: 0x01 (Single-Measurement 모드)" },
          { type: "p", text: "❓ 면접 질문: \"HMC5883L을 가동하고 최초 1회만 데이터가 읽히고 이후 갱신되지 않는 현상이 발생한다면 원인이 무엇인가?\"" },
          { type: "p", text: "✅ 모범 답변: HMC5883L의 디폴트 모드는 Single-Measurement이므로 데이터 1회 출력 후 절전 상태로 돌아갑니다. 초기화 시 Mode Register에 0x00을 써서 Continuous-Measurement 모드로 전환해야 주기적 갱신이 일어납니다." },
          { type: "code", lang: "C", title: "HMC5883L Continuous 모드 초기화", code: `// Configuration Register A (0x00): DO = 75Hz (0b110 = 0x18)
uint8_t cfgA = 0x18;
HAL_I2C_Mem_Write(&hi2c1, HMC_ADDR<<1, 0x00, 1, &cfgA, 1, 50);

// Mode Register (0x02): 0x00 = Continuous-Measurement
uint8_t mode = 0x00;
HAL_I2C_Mem_Write(&hi2c1, HMC_ADDR<<1, 0x02, 1, &mode, 1, 50);
HAL_Delay(10);  // 첫 측정 완료 대기` },

          { type: "h3", text: "🧲 HMC5883L (2) — Stale Data 문제와 ODR 설계" },
          { type: "p", text: "레지스터: Config Register A (0x00) | Bits 4-2: DO (Data Output Rate) | 최대 75Hz" },
          { type: "p", text: "❓ 면접 질문: \"HMC5883L의 최대 ODR을 고려할 때, RTOS 제어 주기를 10ms(100Hz)로 설정하면 어떤 성능 낭비가 발생하는가?\"" },
          { type: "p", text: "✅ 모범 답변: 지자계의 물리적 최대 속도는 75Hz(13.3ms 주기)입니다. 10ms 루프에서는 최소 1~2회 이상 레지스터 값이 변하지 않은 Stale Data를 읽어와 불필요한 I2C 대역폭 낭비와 연산 손실이 발생합니다. 지자계 태스크는 20ms 이상의 주기로 스케줄링하는 것이 효율적입니다." },

          { type: "h3", text: "🧲 HMC5883L (3) — Hard/Soft Iron 보상 및 Tilt Compensation" },
          { type: "p", text: "❓ 면접 질문: \"지자계 센서가 장착된 보드를 기울일 때 발생하는 방위각 오차를 하드웨어/소프트웨어적으로 어떻게 보상하는가?\"" },
          { type: "p", text: "✅ 모범 답변: 금속 프레임이나 모터 주변에 배치 시 영구 오프셋이 생기는 Hard Iron 왜곡이 발생하므로 360도 회전 수집으로 구형 오프셋을 보정합니다. 또한 센서 기울임 시 X, Y축 벡터가 찌그러지므로, MPU6050 상보필터로 도출한 Roll/Pitch를 활용하여 3D 좌표계를 수평면으로 투영하는 Tilt Compensation을 적용합니다." },
          { type: "code", lang: "C", title: "Tilt Compensation Yaw 계산", code: `// Hard-Iron 캘리브레이션 오프셋 적용
float mx = raw_mx - HARD_IRON_X;  // X offset = -14
float my = raw_my - HARD_IRON_Y;  // Y offset = -36
float mz = raw_mz;

// MPU6050 상보필터에서 획득한 Roll/Pitch (도 → 라디안)
float r = roll  * DEG2RAD;
float p = pitch * DEG2RAD;

// Tilt Compensation: 수평면 투영
float mx_comp = mx*cosf(p) + mz*sinf(p);
float my_comp = mx*sinf(r)*sinf(p) + my*cosf(r) - mz*sinf(r)*cosf(p);

// Yaw 방위각 산출
float yaw_mag = atan2f(-my_comp, mx_comp) * RAD2DEG;` },

          { type: "h3", text: "🔴 I2C 버스 락업(Lock-up) 원인 분석" },
          { type: "p", text: "현업에서 가장 가혹하게 검증하는 트러블슈팅 주제: MCU가 슬레이브 센서로부터 데이터를 읽는 도중(SDA Low 구동 상태) 강제 리셋되거나 전기적 노이즈가 유입되면, 슬레이브 센서는 자신이 8비트 데이터를 다 송신하지 못했다고 판단하여 SDA 라인을 영원히 Low로 붙잡고 대기(SDA Hold)합니다. MCU가 재기동해도 SDA가 Low이므로 START 조건 자체가 불가능해집니다." },

          { type: "h3", text: "🔧 I2C 버스 복구: SCL 9-Clock GPIO Toggling" },
          { type: "p", text: "SCL에 9번의 클럭 펄스를 GPIO 수동 제어로 강제 주입합니다. 이 9개의 펄스가 슬레이브의 8-bit 시프트 레지스터 상태 머신을 끝까지 강제 구동시켜 ACK 단계로 진입시키고, 슬레이브는 SDA 라인 제어권을 놓고 High-Z 상태(SDA Release)로 복귀합니다." },
          { type: "code", lang: "C", title: "MyI2C_BusRecovery() — 시스템 기동 시 I2C 버스 복구 루틴", code: `void MyI2C_BusRecovery(void) {
    // 1. PB6(SCL), PB7(SDA) → GPIO Output Open-Drain으로 전환
    GPIO_InitTypeDef GPIO_InitStruct = {0};
    __HAL_RCC_GPIOB_CLK_ENABLE();
    GPIO_InitStruct.Pin   = GPIO_PIN_6 | GPIO_PIN_7;
    GPIO_InitStruct.Mode  = GPIO_MODE_OUTPUT_OD;  // Open-Drain 필수
    GPIO_InitStruct.Pull  = GPIO_PULLUP;
    GPIO_InitStruct.Speed = GPIO_SPEED_FREQ_HIGH;
    HAL_GPIO_Init(GPIOB, &GPIO_InitStruct);

    // SDA Stuck-Low 확인
    if (HAL_GPIO_ReadPin(GPIOB, GPIO_PIN_7) == GPIO_PIN_RESET) {
        // 2. SCL 9-Clock 수동 토글 → 슬레이브 상태 머신 강제 종료
        for (int i = 0; i < 9; i++) {
            HAL_GPIO_WritePin(GPIOB, GPIO_PIN_6, GPIO_PIN_RESET);
            HAL_Delay(10);  // ~50kHz 모사
            HAL_GPIO_WritePin(GPIOB, GPIO_PIN_6, GPIO_PIN_SET);
            HAL_Delay(10);
            // SDA가 해방(High)되면 즉시 탈출
            if (HAL_GPIO_ReadPin(GPIOB, GPIO_PIN_7) == GPIO_PIN_SET) break;
        }
    }

    // 3. 수동 STOP 조건: SCL High 상태에서 SDA Low→High 전이
    HAL_GPIO_WritePin(GPIOB, GPIO_PIN_7, GPIO_PIN_RESET);
    HAL_Delay(10);
    HAL_GPIO_WritePin(GPIOB, GPIO_PIN_6, GPIO_PIN_SET);
    HAL_Delay(10);
    HAL_GPIO_WritePin(GPIOB, GPIO_PIN_7, GPIO_PIN_SET);  // STOP 성립
    HAL_Delay(10);

    // 4. 핀 복원: I2C1 Alternate Function (AF4 Open-Drain)
    GPIO_InitStruct.Mode      = GPIO_MODE_AF_OD;
    GPIO_InitStruct.Alternate = GPIO_AF4_I2C1;
    HAL_GPIO_Init(GPIOB, &GPIO_InitStruct);
}` },

          { type: "h3", text: "🔥 FreeRTOS NVIC 우선순위 설계: EXTI4 마스킹 경계" },
          { type: "p", text: "MPU6050의 INT 핀을 PA4(EXTI4)에 연결했을 때, EXTI4의 Preemption Priority를 반드시 5 이상으로 지정해야 하는 이유가 있습니다. FreeRTOS 커널은 configMAX_SYSCALL_INTERRUPT_PRIORITY(STM32 기본: 5) 이하의 인터럽트만 관리 범위에 둡니다." },
          { type: "code", lang: "Text", title: "FreeRTOS NVIC Priority Map", code: `우선순위 0 (최고)
├── [0 ~ 4]: Kernel Unmasked Zone
│            → RTOS API 사용 불가 영역
│            → 지터 없는 하드웨어 초정밀 연산 전용
│
├── ────── configMAX_SYSCALL_INTERRUPT_PRIORITY = 5 ──────
│
├── [5 ~ 15]: Kernel Managed Zone
│            → EXTI4 (MPU6050 INT) → Priority = 5 설정
│            → FromISR 계열 API 안전 호출 가능
│            → osSemaphoreRelease() / xSemaphoreGiveFromISR()
│
우선순위 15 (최저)` },
          { type: "p", text: "⚠️ Hard Fault 원인: EXTI4 Priority를 0~4로 설정하면, ISR 내에서 osSemaphoreRelease() 또는 FromISR 계열 동기화 API 호출 시 커널 레지스터 구조 파괴(Assert)가 발생하여 즉시 Hard Fault로 시스템이 뻗습니다. CubeMX에서 EXTI4 NVIC Priority를 정확히 5로 설정하는 것이 핵심입니다." },

          { type: "h3", text: "📊 포트폴리오 면접 시나리오 구성 — 4페이지 전략" },
          { type: "ul", items: [

          ]},

      {
        id: 15,
        title: "ATmega328P 하이브리드 UART GPS 수신기: 라이브러리 탈피 Baremetal 설계 및 메모리 최적화",
        excerpt: "외부 라이브러리(TinyGPS++)를 전혀 사용하지 않고 NMEA 원본을 직접 파싱하는 커스텀 펌웨어 설계. 단일 UART 버스 충돌을 Bit-banging으로 극복하고, TinyGPS++ 대비 RAM 17.3%p · Flash 24.6%p 절감을 실측 검증한 Baremetal 최적화 기록.",
        excerpt_en: "Custom firmware parsing raw NMEA without any external library, overcoming single-UART bus conflict via bit-banging, and achieving RAM −17.3%p / Flash −24.6%p savings over TinyGPS++ verified through PlatformIO builds.",
        category: "firmware",
        level: "Advanced",
        date: "2026. 09. 05",
        readTime: "15 min",
        tags: ["ATmega328P", "AVR-GCC", "NMEA", "Bit-banging", "GY-NEO6MV2", "Memory Optimization"],
        sections: [
          { type: "h3", text: "🎯 프로젝트 개요" },
          { type: "p", text: "ATmega328P(Arduino UNO) 기반 GY-NEO6MV2 GPS 모듈 프로젝트. 외부 라이브러리 의존도를 탈피하고 AVR-GCC Baremetal C로 NMEA 데이터를 직접 파싱하여 2KB RAM/32KB Flash 자원을 극대화했습니다. u-blox 6 칩의 MS621FE 백업 배터리를 활용해 Hot Start(TTFF 1초 내)를 구현했습니다." },
          { type: "img", src: "images/9.GPS_img.png", alt: "GY-NEO6MV2 u-blox 6 GPS 모듈" },

          { type: "h3", text: "🔌 하이브리드 UART 아키텍처" },
          { type: "p", text: "단일 HW UART 핀(0번)을 PC(CH340 USB-TTL)와 GPS가 공유하면 전압 오버드라이브로 GPS 신호가 묻히는 버스 충돌이 발생합니다. 이를 해결하기 위해 통신을 물리적으로 분리했습니다." },
          { type: "ul", items: [
            "GPS 수신 (RX): PB4 핀 — Bit-banging 소프트 시리얼 (9600bps, 104μs/bit, 중앙 샘플링)",
            "PC 송신 (TX): PD1 핀 — HW UART, UDR0/UCSR0A 레지스터 직접 제어 (논블로킹 비동기)",
            "GPS 모듈 RX 핀 NC 처리 — 시리얼 모니터 출력이 역류하는 칩 다운 현상 원천 차단"
          ]},
          { type: "code", lang: "C", title: "Bit-banging 9600bps 수신 핵심 로직", code: `// PB4: GPS 소프트 RX 초기화
void uart_softRX_init(void) {
    DDRB  &= ~(1 << PB4);   // 입력 모드
    PORTB |=  (1 << PB4);   // Pull-up 활성화
}

uint8_t uart_softRX_byte(void) {
    uint8_t data = 0;
    while (PINB & (1 << PB4));   // Start Bit 하강 에지 대기
    _delay_us(52);               // 반 주기 대기 → 첫 비트 중앙 위치
    for (int i = 0; i < 8; i++) {
        _delay_us(104);          // 1 bit = 104μs @ 9600bps
        data >>= 1;
        if (PINB & (1 << PB4)) data |= 0x80;
    }
    _delay_us(104);              // Stop Bit
    return data;
}

// PD1: 하드웨어 UART 논블로킹 송신
void uart_hw_putc(char c) {
    while (!(UCSR0A & (1 << UDRE0)));  // TX 버퍼 빌 때까지 대기
    UDR0 = c;
}` },

          { type: "h3", text: "⚙️ NMEA 커스텀 파서 및 좌표 변환 알고리즘" },
          { type: "p", text: "표준 strtok()는 빈 필드(,,)를 건너뛰어 인덱스 오염이 발생합니다. 쉼표 카운팅 기반 커스텀 파서로 $GPGGA 문장에서 위도/경도/시간/Fix Quality를 안전하게 추출합니다." },
          { type: "code", lang: "C", title: "쉼표 카운팅 NMEA 파서 + DDMM→DD 변환", code: `// $GPGGA 쉼표 인덱스 구조:
// $GPGGA,시간(1),위도(2),N/S(3),경도(4),E/W(5),Fix(6),...
void parse_gpgga(const char *nmea) {
    int  comma_cnt = 0;
    char field[16] = {0};
    int  fi = 0;

    for (int i = 0; nmea[i]; i++) {
        if (nmea[i] == ',') {
            field[fi] = '\0'; fi = 0;
            comma_cnt++;
            if (comma_cnt == 6 && field[0] == '0') {
                uart_hw_print("[NO FIX]\r\n"); return;
            }
            // 위도(2), 경도(4) 필드 저장 처리 생략
        } else {
            field[fi++] = nmea[i];
        }
    }
}

// NMEA DDMM.MMMMM → 십진수 도(DD) 변환
double nmea_to_dd(const char *s) {
    double raw  = atof(s);           // e.g. 3732.53067
    int    deg  = (int)(raw / 100); // 37
    double mins = raw - deg * 100.0; // 32.53067
    return deg + mins / 60.0;       // 37.5421778°
}

// 구글맵 URL 자동 생성
void build_google_url(double lat, double lon) {
    char buf[12];
    uart_hw_print("https://maps.google.com/?q=");
    dtostrf(lat, 9, 6, buf); uart_hw_print(buf);
    uart_hw_putc(',');
    dtostrf(lon, 10, 6, buf); uart_hw_print(buf);
    uart_hw_print("\r\n");
}` },

          { type: "h3", text: "\ud83c\udfd7\ufe0f \uc2dc\uc2a4\ud15c \uc544\ud0a4\ud14d\ucc98 \u2014 \uc11c\ubc84\ub9ac\uc2a4 \ud30c\uc774\ud504\ub77c\uc778" },
          { type: "p", text: "CloudTrail \u2192 EventBridge \u2192 SNS \u2192 Lambda \u2192 Slack\uc758 \uc644\uc804 \uc11c\ubc84\ub9ac\uc2a4 \ub2e8\ubc29\ud5a5 \ud30c\uc774\ud504\ub77c\uc778\uc785\ub2c8\ub2e4. \uc774\ubca4\ud2b8 \ud544\ud130\ub9c1\uc744 EventBridge\uc5d0\uc11c \uc120\ud589\ud558\uc5ec \ubd88\ud544\uc694\ud55c Lambda \ud638\ucd9c\uc744 \uc6d0\ucc9c \ucc28\ub2e8\ud569\ub2c8\ub2e4." },
          { type: "code", lang: "Text", title: "\uc804\uccb4 \ub370\uc774\ud130 \ud750\ub984", code: `AWS CloudTrail / API \ud638\ucd9c\n        \u2193\nAmazon EventBridge (\uc774\ubca4\ud2b8 \ud328\ud134 \ud544\ud130\ub9c1)\n  \u251c\u2500\u2500 aws.iam   \u2192 IAM \uc815\ucc45/\uc0ac\uc6a9\uc790 \ubcc0\uacbd\n  \u251c\u2500\u2500 aws.ec2   \u2192 \uc778\uc2a4\ud134\uc2a4\u00b7SG \ubcc0\uacbd\n  \u2514\u2500\u2500 aws.signin \u2192 Console Login \uac10\uc9c0\n        \u2193\nAmazon SNS Topic (\ud32c\uc544\uc6c3 \u2014 Lambda \ud2b8\ub9ac\uac70)\n        \u2193\nAWS Lambda Node.js 22.x\n  \u251c\u2500\u2500 SNS \uc774\ubca4\ud2b8 \ud30c\uc2f1 (userIdentity, eventName, sourceIP)\n  \u251c\u2500\u2500 \uc0c9\uc0c1 \uc6b0\uc120\uc21c\uc704 \ubd84\uae30 (Root\u2192Black, Delete\u2192Red \u2026)\n  \u2514\u2500\u2500 Slack Attachment + CloudTrail \ubc14\ub85c\uac00\uae30 \ubc84\ud2bc POST\n        \u2193\nSlack Incoming Webhook \u2192 #devops \ucc44\ub110` },

          { type: "code", lang: "HCL", title: "modules/eventbridge/main.tf", code: `resource "aws_cloudwatch_event_rule" "slack_notify" {\n  name        = "slack-notification-\${var.environment}"\n  description = "IAM/EC2/SignIn \ubcf4\uc548 \uc774\ubca4\ud2b8 \uac10\uc9c0"\n\n  event_pattern = jsonencode({\n    source      = ["aws.iam", "aws.ec2", "aws.signin"]\n    detail-type = [\n      "AWS API Call via CloudTrail",\n      "AWS Console Sign In via CloudTrail"\n    ]\n    detail = {\n      eventName = [\n        { prefix = "Attach" }, { prefix = "Detach" },\n        "CreateUser", "DeleteUser", "CreateAccessKey",\n        "ChangePassword", "RunInstances", "StopInstances",\n        "TerminateInstances", "ConsoleLogin"\n      ]\n    }\n  })\n}\n\nresource "aws_cloudwatch_event_target" "to_sns" {\n  rule = aws_cloudwatch_event_rule.slack_notify.name\n  arn  = var.sns_topic_arn\n}` },

          { type: "code", lang: "JavaScript", title: "Lambda app.js \u2014 \uc0c9\uc0c1 \ubd84\uae30 + Slack Webhook POST", code: `// modules/lambda/app.js (Node.js 22.x)\nconst https = require('https');\n\nexports.handler = async (event) => {\n  const snsMsg  = JSON.parse(event.Records[0].Sns.Message);\n  const detail  = snsMsg.detail;\n  const evtName = detail.eventName;\n  const user    = detail.userIdentity;\n\n  // \uc0c9\uc0c1 \uc6b0\uc120\uc21c\uc704 \uacb0\uc815 (Root \ucd5c\uc6b0\uc120)\n  let color = '#ff00ff';\n  if (user.type === 'Root')                        color = '#000000';\n  else if (/Delete|Detach|Revoke/.test(evtName))  color = '#ff000f';\n  else if (/Create|Attach/.test(evtName))         color = '#00ff0f';\n  else if (evtName === 'ConsoleLogin')             color = '#0000ff';\n  else if (/Stop|Terminate/.test(evtName))        color = '#ff000f';\n\n  const ctUrl = \`https://\${snsMsg.region}.console.aws.amazon.com/cloudtrail/\`;\n\n  const payload = {\n    attachments: [{\n      color,\n      fallback: \`[\${evtName}] by \${user.userName || user.type}\`,\n      fields: [\n        { title: 'Event',     value: evtName,                    short: true },\n        { title: 'User',      value: user.userName || user.type, short: true },\n        { title: 'Region',    value: snsMsg.region,              short: true },\n        { title: 'Source IP', value: detail.sourceIPAddress,     short: true }\n      ],\n      actions: [{ type: 'button', text: '\ud83d\udccb CloudTrail \ubcf4\uae30', url: ctUrl }]\n    }]\n  };\n  await postToSlack(process.env.SLACK_WEBHOOK_URL, payload);\n};` },

          { type: "code", lang: "YAML", title: ".gitlab-ci.yml \ud575\uc2ec \uad6c\uc870", code: `stages: [validate, plan, deploy, cleanup]\n\nvalidate:\n  stage: validate\n  script:\n    - terraform fmt -check\n    - terraform validate\n\nplan:prod:\n  stage: plan\n  script:\n    - terraform init\n    - terraform plan -out=plan.tfplan\n  artifacts:\n    paths: [plan.tfplan]\n    expire_in: 1 hour\n  rules:\n    - changes: [terraform/env/prod/**]\n\ndeploy:prod:\n  stage: deploy\n  script:\n    - terraform apply plan.tfplan\n  resource_group: prod\n  rules:\n    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH\n      changes: [terraform/env/prod/**]\n\ncleanup:prod:\n  stage: cleanup\n  script:\n    - terraform destroy -auto-approve\n  when: manual` },

    ];




    const SERIES = [
      { title: "STM32 OTA 시스템 구축 A to Z", title_en: "Building STM32 OTA System A to Z", desc: "부트로더 설계 → ESP8266 다운로드 → Flash 파티셔닝 → CRC32 검증 전 과정", desc_en: "Bootloader design → ESP8266 download → Flash partitioning → CRC32 validation", posts: 5, completed: 3, tags: ["STM32", "OTA", "Bootloader"] },
      { title: "FreeRTOS 실전 패턴 가이드", title_en: "FreeRTOS Practical Pattern Guide", desc: "Task 설계, Semaphore/Mutex 동기화, 우선순위 역전 해결, Stack 모니터링", desc_en: "Task design, Semaphore/Mutex sync, Priority inversion, Stack monitoring", posts: 4, completed: 2, tags: ["FreeRTOS", "RTOS", "Mutex"] },
      { title: "센서 융합 알고리즘 Deep Dive", title_en: "Sensor Fusion Algorithm Deep Dive", desc: "상보필터, Tilt-Compensated Yaw, Hard-Iron 캘리브레이션 이론과 구현", desc_en: "Complementary filter, Tilt-Compensated Yaw, Hard-Iron calibration theory", posts: 3, completed: 2, tags: ["Sensor Fusion", "MPU6050"] },
      { title: "MISRA-C 코딩 스탠다드 정리", title_en: "MISRA-C Coding Standard Summary", desc: "방산/자동차 SW 개발 필수 MISRA-C:2012 주요 Rule 및 위반 사례 분석", desc_en: "Essential MISRA-C:2012 Rules and violation case analysis for automotive/defense", posts: 6, completed: 1, tags: ["MISRA-C", "Safety"] },
    ];

    /* ========================================
       AUTO SNIPPETS — 포스트 내 code 섹션에서 자동 수집
    ======================================== */
    function collectSnippets() {
      const snippets = [];
      POSTS.forEach(post => {
        if (!post.sections) return;
        post.sections.forEach(sec => {
          if (sec.type === 'code') {
            snippets.push({
              title: sec.title || post.title,
              lang: sec.lang || 'C',
              code: sec.code,
              desc: `📄 출처: "${post.title}"`,
              tags: post.tags.slice(0, 3),
              category: post.category,   // ← 카테고리 필터용
              postId: post.id
            });
          }
        });
      });
      return snippets;
    }

    /* ========================================
       STATE & URL PARAMS
    ======================================== */
    const urlParams = new URLSearchParams(window.location.search);
    let activeCategory = urlParams.get('cat') || "all";
    let activeTab = urlParams.get('tab') || "posts";
    let searchQuery = urlParams.get('q') || "";
    let currentLang = urlParams.get('lang') || 'ko';

    function updateUrlParams() {
      const url = new URL(window.location);
      if (activeCategory !== 'all') url.searchParams.set('cat', activeCategory); else url.searchParams.delete('cat');
      if (activeTab !== 'posts') url.searchParams.set('tab', activeTab); else url.searchParams.delete('tab');
      if (searchQuery) url.searchParams.set('q', searchQuery); else url.searchParams.delete('q');
      if (currentLang !== 'ko') url.searchParams.set('lang', currentLang); else url.searchParams.delete('lang');
      window.history.pushState({}, '', url);
    }

    /* ========================================
       MODAL
    ======================================== */
    const overlay = document.getElementById('modal-overlay');
    const modalTitle = document.getElementById('modal-title');
    const modalBody = document.getElementById('modal-body');
    const closeBtn = document.getElementById('modal-close');

    function openPostModal(post) {
      // EN 모드 대응: 제목은 title_en 우선
      const title = (currentLang === 'en' && post.title_en) ? post.title_en : post.title;
      modalTitle.textContent = title;
      let html = `
        <div class="tag-list">${post.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
        <p style="color:var(--muted);font-size:13px;margin-bottom:20px">
          <span class="level-badge ${getLevelClass(post.level)}">${post.level}</span>
          &nbsp; ⏱ ${post.readTime} &nbsp; ${post.date}
        </p>
      `;
      if (post.sections) {
        post.sections.forEach(sec => {
          if (sec.type === 'h3') html += `<h3>${sec.text}</h3>`;
          else if (sec.type === 'p') html += `<p>${sec.text}</p>`;
          else if (sec.type === 'ul') html += `<ul>${sec.items.map(i => `<li>${i}</li>`).join('')}</ul>`;
          else if (sec.type === 'img') html += `<div class="img-wrap"><img src="${sec.src}" alt="${sec.alt}" loading="lazy"></div>`;
          else if (sec.type === 'code') {
            html += `<p style="font-size:13px;font-weight:700;color:var(--cyan);margin-top:12px">${sec.title || ''}</p>`;
            html += `<pre><code>${escapeHtml(sec.code)}</code></pre>`;
          }
        });
      }
      // EN 모드: 포스트 하단에 번역 안내
      if (currentLang === 'en') {
        html += `<p style="margin-top:24px;padding:12px 16px;background:rgba(14,165,233,.05);border-radius:10px;font-size:13px;color:var(--muted)">📝 Full English translation is available in the dedicated post page (Ctrl+Click the card).</p>`;
      }
      modalBody.innerHTML = html;
      overlay.classList.add('active');
      document.body.style.overflow = 'hidden';
    }
    function closeModal() {
      overlay.classList.remove('active');
      document.body.style.overflow = '';
    }
    closeBtn.addEventListener('click', closeModal);
    overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    /* ========================================
       RENDER
    ======================================== */
    function renderCategories() {
      const ul = document.getElementById('category-list');
      ul.innerHTML = CATEGORIES.map(c => `
        <li><button class="cat-btn ${activeCategory === c.id ? 'active' : ''}" data-cat="${c.id}">
          ${c.icon ? '<span>'+c.icon+'</span>' : ''} ${c.label}
        </button></li>
      `).join('');
      ul.querySelectorAll('.cat-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          if (e.ctrlKey || e.metaKey) {
            window.open(`?cat=${btn.dataset.cat}&tab=${activeTab}&lang=${currentLang}`, '_blank');
          } else {
            activeCategory = btn.dataset.cat;
            updateUrlParams();
            render();
          }
        });
      });
    }

    function renderTabs() {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === activeTab);
        btn.onclick = (e) => {
          if (e.ctrlKey || e.metaKey) {
            window.open(`?cat=${activeCategory}&tab=${btn.dataset.tab}&lang=${currentLang}`, '_blank');
          } else {
            activeTab = btn.dataset.tab;
            updateUrlParams();
            render();
          }
        };
      });
    }

    function getLevelClass(l) {
      return { Expert:'level-expert', Advanced:'level-advanced', Intermediate:'level-intermediate', Beginner:'level-beginner' }[l] || 'level-intermediate';
    }

    function filterPosts() {
      return POSTS.filter(p => {
        const catMatch = activeCategory === "all" || p.category === activeCategory;
        const q = searchQuery.toLowerCase();
        const sMatch = !q || p.title.toLowerCase().includes(q) || p.tags.some(t => t.toLowerCase().includes(q)) || p.excerpt.toLowerCase().includes(q);
        return catMatch && sMatch;
      });
    }

    function renderPosts() {
      const filtered = filterPosts();
      const catLabel = CATEGORIES.find(c => c.id === activeCategory)?.label || "All";
      let html = `<div class="feed-header"><h2>${activeCategory === 'all' ? 'Latest Posts' : catLabel}</h2><span>${filtered.length} posts</span></div>`;
      if (!filtered.length) {
        html += `<div class="empty-state"><p>${currentLang === 'en' ? 'No results found.' : '검색 결과가 없습니다.'}</p></div>`;
      } else {
        filtered.forEach(p => {
          // EN 모드일 때 title_en / excerpt_en 우선 사용
          const title   = (currentLang === 'en' && p.title_en)   ? p.title_en   : p.title;
          const excerpt = (currentLang === 'en' && p.excerpt_en) ? p.excerpt_en : p.excerpt;
          const ctrlHint = p.url ? (currentLang === 'en' ? ' (Ctrl+Click: new page)' : ' (Ctrl+클릭: 새 탭)') : '';
          html += `
            <article class="post-card" data-post-id="${p.id}">
              <div class="post-meta">
                <span class="level-badge ${getLevelClass(p.level)}">${p.level}</span>
                <span class="meta-text">⏱ ${p.readTime}</span>
                <span class="meta-text">${p.date}</span>
              </div>
              <h3 class="post-title">${title}</h3>
              <p class="post-excerpt">${excerpt}</p>
              <div class="post-footer">
                <div class="post-tags">${p.tags.map(t => `<span class="post-tag">#${t}</span>`).join('')}</div>
                <span class="read-more">Read Article${ctrlHint} →</span>
              </div>
            </article>`;
        });
      }
      return html;
    }

    function renderSeries() {
      const headerTitle = currentLang === 'en' ? 'Learning Series' : '학습 시리즈';
      let html = `<div class="feed-header"><h2>${headerTitle}</h2><span>${SERIES.length} series</span></div><div class="series-list">`;
      SERIES.forEach(s => {
        const pct = Math.round((s.completed / s.posts) * 100);
        const title = (currentLang === 'en' && s.title_en) ? s.title_en : s.title;
        const desc  = (currentLang === 'en' && s.desc_en)  ? s.desc_en  : s.desc;
        html += `
          <div class="series-card">
            <h4>${title}</h4><p>${desc}</p>
            <div class="series-meta"><span>📄 ${s.completed}/${s.posts}</span><span>📊 ${pct}%</span></div>
            <div class="post-tags" style="margin-top:8px">${s.tags.map(t => `<span class="post-tag">#${t}</span>`).join('')}</div>
            <div class="series-progress"><div class="series-progress-bar" style="width:${pct}%"></div></div>
          </div>`;
      });
      return html + '</div>';
    }

    function renderSnippets() {
      const snippets = collectSnippets();
      const q = searchQuery.toLowerCase();

      // 카테고리 필터 (sidebar 카테고리와 동기화)
      const filtered = snippets.filter(s => {
        const catMatch = activeCategory === 'all' || s.category === activeCategory;
        const searchMatch = !q || s.title.toLowerCase().includes(q) || s.tags.some(t => t.toLowerCase().includes(q));
        return catMatch && searchMatch;
      });

      // 스니펫 고유 카테고리 목록
      const allCats = [...new Set(snippets.map(s => s.category))];
      const autoCollectTxt = currentLang === 'en' ? 'snippets (auto-collected)' : 'snippets (포스트에서 자동 수집)';
      let html = `<div class="feed-header"><h2>Code Snippets</h2><span>${filtered.length} ${autoCollectTxt}</span></div>`;
      html += `<div class="snippet-cats">`;
      html += `<button class="snippet-cat-btn ${activeCategory==='all'?'active':''}" data-scat="all">All</button>`;
      allCats.forEach(cat => {
        const label = CATEGORIES.find(c => c.id === cat)?.label || cat;
        html += `<button class="snippet-cat-btn ${activeCategory===cat?'active':''}" data-scat="${cat}">${label}</button>`;
      });
      html += `</div>`;

      if (!filtered.length) {
        html += `<div class="empty-state"><p>${currentLang === 'en' ? 'No results found.' : '검색 결과가 없습니다.'}</p></div>`;
      } else {
        filtered.forEach(s => {
          const sTitle = (currentLang === 'en' && s.title_en) ? s.title_en : s.title;
          const sDesc  = (currentLang === 'en') ? `💡 Source: "${sTitle}"` : `💡 출처: "${sTitle}"`;
          html += `
            <div class="snippet-card">
              <div class="snippet-header"><h4>${sTitle}</h4><span class="snippet-lang">${s.lang}</span></div>
              <div class="snippet-code">${escapeHtml(s.code)}</div>
              <div class="snippet-desc">${sDesc}</div>
              <div class="post-tags">${s.tags.map(t => `<span class="post-tag">#${t}</span>`).join('')}</div>
            </div>`;
        });
      }
      return html;
    }

    function escapeHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function render() {
      renderCategories();
      renderTabs();
      const feed = document.getElementById('feed-content');
      if (activeTab === 'posts') feed.innerHTML = renderPosts();
      else if (activeTab === 'series') feed.innerHTML = renderSeries();
      else if (activeTab === 'snippets') feed.innerHTML = renderSnippets();

      // 포스트 카드 클릭 이벤트 바인딩
      if (activeTab === 'posts') {
        feed.querySelectorAll('.post-card').forEach(card => {
          card.addEventListener('click', (e) => {
            const postId = parseInt(card.dataset.postId);
            const post = POSTS.find(p => p.id === postId);
            if (!post) return;

            // Ctrl+Click → 새 페이지로 이동
            if ((e.ctrlKey || e.metaKey) && post.url) {
              window.open(post.url, '_blank');
              return;
            }
            // 일반 클릭 → 모달 열기
            openPostModal(post);
          });
        });
      }
      // 스니펫 카테고리 버튼 이벤트 바인딩
      if (activeTab === 'snippets') {
        feed.querySelectorAll('.snippet-cat-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            if (e.ctrlKey || e.metaKey) {
              window.open(`?cat=${btn.dataset.scat}&tab=snippets&lang=${currentLang}`, '_blank');
            } else {
              activeCategory = btn.dataset.scat;
              updateUrlParams();
              render();
            }
          });
        });
      }
    }

    /* ========================================
       LANGUAGE TOGGLE
    ======================================== */
    // currentLang 은 STATE 섹션에서 선언됨

    document.getElementById('lang-toggle').addEventListener('click', (e) => {
      const btn = e.target.closest('.lang-btn');
      if (!btn || btn.dataset.lang === currentLang) return;
      currentLang = btn.dataset.lang;
      localStorage.setItem('portfolio-lang', currentLang);
      updateUrlParams();
      document.querySelectorAll('.lang-btn').forEach(b =>
        b.classList.toggle('active', b.dataset.lang === currentLang)
      );
      // data-ko / data-en 속성 교체 (히어로 섹션)
      document.querySelectorAll('[data-ko][data-en]').forEach(el => {
        el.innerHTML = el.getAttribute(`data-${currentLang}`);
      });
      // 포스트 카드 재렌더링 (title_en / excerpt_en 반영)
      render();
    });

    /* ========================================
       INIT
    ======================================== */
    // Initial lang UI setup
    document.querySelectorAll('.lang-btn').forEach(b =>
      b.classList.toggle('active', b.dataset.lang === currentLang)
    );
    document.querySelectorAll('[data-ko][data-en]').forEach(el => {
      el.innerHTML = el.getAttribute(`data-${currentLang}`);
    });

    document.getElementById('search-input').value = searchQuery;
    document.getElementById('search-input').addEventListener('input', e => {
      searchQuery = e.target.value;
      updateUrlParams();
      render();
    });
    render();

    /* ========================================
       DARK / LIGHT THEME TOGGLE
    ======================================== */
    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('portfolio-theme', theme);
      document.getElementById('theme-toggle').textContent = theme === 'dark' ? '☀️' : '🌙';
    }
    const savedTheme = localStorage.getItem('portfolio-theme') ||
      (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    setTheme(savedTheme);
    document.getElementById('theme-toggle').addEventListener('click', () => {
      setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });
  </script>
</body>
</html>
